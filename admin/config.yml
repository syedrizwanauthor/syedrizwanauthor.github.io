backend:
  name: github
  repo: syedrizwanauthor/syedrizwanauthor.github.io
  branch: main

media_folder: "images/blog"
public_folder: "/images/blog"

publish_mode: simple

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
       - label: "Publish Date"
        name: "date"
        widget: "datetime"
        input_timezone: "Asia/Kolkata"
        output_utc: false
      - label: "Description"
        name: "description"
        widget: "text"
        required: false
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
      - label: "Article"
        name: "body"
        widget: "markdown"
        
